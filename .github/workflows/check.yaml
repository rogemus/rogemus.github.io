name: Check

on:
  # Runs on pushes (merges) to the default branch
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TZ: Europe/Warsaw

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Verify
        uses: ./.github/actions/verify
