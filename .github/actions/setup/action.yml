name: Setup
description: Install Hugo, Node.js and npm dependencies. Run actions/checkout first.

inputs:
  hugo-version:
    description: Hugo version to install
    required: false
    default: "0.170.1"

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      env:
        HUGO_VERSION: ${{ inputs.hugo-version }}
      run: |
        echo "Installing Hugo ${HUGO_VERSION}..."
        curl -sfL --output-dir "${RUNNER_TEMP}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        mkdir -p "${HOME}/.local/hugo"
        tar -C "${HOME}/.local/hugo" -xf "${RUNNER_TEMP}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install Node.js dependencies
      shell: bash
      env:
        HUSKY: 0
      run: npm ci
